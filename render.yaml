# Render deployment manifest for Plant Disease project
# This defines a Python backend service and a static frontend site.

services:
  - type: web
    name: plant-disease-backend
    env: python
    plan: starter
    region: oregon
    branch: master
    buildCommand: bash -lc 'if [ -n "$MODEL_URL" ]; then curl -L -o plant_model.h5 "$MODEL_URL"; fi && python3 -m venv venv && ./venv/bin/python -m pip install --upgrade pip setuptools wheel && ./venv/bin/python -m pip install -r requirements.txt'
    startCommand: bash -lc './venv/bin/python -m uvicorn api:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MODEL_URL
        value: "https://<your-model-storage>/plant_model.h5"

staticSites:
  - type: static_site
    name: plant-disease-frontend
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://<your-backend>.onrender.com"
