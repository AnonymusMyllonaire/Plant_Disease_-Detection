# Render deployment manifest for Plant Disease project
# This defines a Python backend service and a static frontend site.

services:
  - type: web
    name: plant-disease-backend
    env: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1

staticSites:
  - type: static_site
    name: plant-disease-frontend
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://<your-backend>.onrender.com"
